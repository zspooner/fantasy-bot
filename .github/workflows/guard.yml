name: lineup-guard
on:
  schedule:
    # UTC, every 2h through each game day; guard.py --wait sleeps to the next ET deadline.
    - cron: '5 9,11,13,15,17,19,21 * * 0'
    - cron: '2 19,21 * * 1'
    - cron: '5 19,21 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
permissions:
  contents: read
concurrency: guard
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: python3 guard.py ${{ github.event_name == 'schedule' && '--wait' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
